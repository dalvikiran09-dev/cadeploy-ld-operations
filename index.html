<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CADEPLOY L&D Operations System</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cadeploy_settings');
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
